[project]
name = "toolshed"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── 原有 ──
    "beautifulsoup4>=4.15.0",
    "minio>=7.2.20",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "uuid-utils>=1.0.0",
    # ── itsub：全平台 ──
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "whisperx>=3.8.4",
    # ── itsub：仅 Windows（CUDA 12.8）──
    "torch~=2.8.0; sys_platform == 'win32'",
    "torchaudio~=2.8.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
override-dependencies = [
    "torch~=2.8.0; sys_platform == 'win32'",
    "torchaudio~=2.8.0; sys_platform == 'win32'",
    "torchvision~=0.23.0; sys_platform == 'win32'",
    "torchcodec>=0.6.0,<0.8.0; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
